# Nginx configuration for ZKTeco iClock protocol endpoints
# 
# IMPORTANT: Add this location block INSIDE your server block,
# BEFORE the main location / block in your site's nginx config.
#
# Location: /etc/nginx/sites-available/yoursite.conf (for multi-site)
#          or /etc/nginx/conf.d/frappe-bench-frappe.conf (for single site)

# iClock Protocol Handler (required for devices to communicate)
# Devices connect by IP, not domain, so we need X-Frappe-Site-Name header

location ~* ^/iclock/(cdata|getrequest|devicecmd) {
    # Pass to Frappe bench (default port 8000, adjust if different)
    proxy_pass http://127.0.0.1:8000;
    
    # CRITICAL: Set site name for multi-tenant setups
    # Replace 'yoursite.local' with your actual site name
    proxy_set_header X-Frappe-Site-Name yoursite.local;
    
    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Important: Don't modify Content-Type (must remain text/plain)
    proxy_pass_header Content-Type;
    
    # Timeouts (devices may be slow on 3G/4G)
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    # Don't buffer (immediate response for devices)
    proxy_buffering off;
}

# --- EXAMPLE SERVER BLOCK STRUCTURE ---
# Your full nginx config should look like this:
#
# server {
#     listen 80;
#     server_name yoursite.local;
#     
#     # iClock endpoints (THIS MUST COME FIRST)
#     location ~* ^/iclock/(cdata|getrequest|devicecmd) {
#         ... (configuration above)
#     }
#     
#     # Main Frappe location (comes after iclock)
#     location / {
#         proxy_pass http://127.0.0.1:8000;
#         ...
#     }
# }

# --- INSTALLATION STEPS ---
# 1. Edit your site's nginx config:
#    sudo nano /etc/nginx/sites-available/yoursite.conf
#
# 2. Add the location block INSIDE server {} and BEFORE location /
#
# 3. Replace 'yoursite.local' with your actual site name
#
# 4. Verify bench port (default 8000):
#    cd /path/to/bench && bench serve --port
#    (if different, update proxy_pass above)
#
# 5. Test configuration:
#    sudo nginx -t
#
# 6. Reload nginx:
#    sudo systemctl reload nginx
#
# 7. Test from device or curl:
#    curl -v "http://your-server-ip/iclock/cdata?SN=TEST001"
#    (should return text/plain, not HTML/JSON)

# --- TROUBLESHOOTING ---
# - If devices receive HTML 404: location block is after location /
# - If devices receive JSON: proxy_pass_header Content-Type missing
# - If multi-tenant and devices fail: X-Frappe-Site-Name incorrect
# - Check nginx error log: sudo tail -f /var/log/nginx/error.log
# - Check Frappe log: bench --site yoursite tail

# --- MULTI-SITE SETUP ---
# For multi-site, create separate location blocks or use map:
#
# map $http_x_device_site $frappe_site {
#     default "site1.local";
#     "site2" "site2.local";
# }
#
# location ~* ^/iclock/ {
#     proxy_set_header X-Frappe-Site-Name $frappe_site;
#     ...
# }
#
# Then configure devices to send X-Device-Site header (if supported).

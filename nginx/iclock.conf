# Nginx configuration for ZKTeco iClock protocol endpoints
# 
# This configuration must be added to your site's nginx config file.
# Location: /etc/nginx/conf.d/yoursite.conf (or similar)
#
# IMPORTANT: Add these location blocks BEFORE your main location / block

# Option 1: Direct pass-through (Recommended)
# This passes /iclock/* requests directly without Frappe's JSON wrapper

location ~* ^/iclock/(cdata|getrequest|devicecmd) {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Important: Don't modify Content-Type
    proxy_pass_header Content-Type;
    
    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    # Don't buffer (immediate response)
    proxy_buffering off;
}

# Option 2: Rewrite to whitelisted method
# Use this if Option 1 doesn't work with your setup
#
# location ~* ^/iclock/(.*) {
#     rewrite ^/iclock/(.*)$ /api/method/prime_att.zkteco.iclock_protocol.iclock_handler last;
# }

# After adding this configuration:
# 1. Test configuration: sudo nginx -t
# 2. Reload nginx: sudo systemctl reload nginx
# 3. Check logs: sudo tail -f /var/log/nginx/error.log
#
# Troubleshooting:
# - If devices still receive JSON, ensure this block is BEFORE location / {}
# - Check that proxy_pass port matches your bench port (8000 is default)
# - For multi-tenant, adjust proxy_pass to correct backend
# - Enable debug logging: error_log /var/log/nginx/error.log debug;
